<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#EEF2FF"/>
      <stop offset="0.55" stop-color="#F8FAFC"/>
      <stop offset="1" stop-color="#ECFDF5"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6366F1"/>
      <stop offset="0.55" stop-color="#0EA5E9"/>
      <stop offset="1" stop-color="#22C55E"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#0F172A" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="1200" height="600" rx="48" fill="url(#bg)"/>

  <g filter="url(#shadow)">
    <rect x="80" y="80" width="1040" height="440" rx="40" fill="#FFFFFF"/>
  </g>

  <text x="140" y="175" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial" font-size="34" font-weight="700" fill="#0F172A">Chiropractor</text>
  <text x="140" y="215" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial" font-size="20" font-weight="600" fill="#475569">Demo layout</text>

  <!-- Spine-like icon -->
  <g transform="translate(850 140)">
    <path d="M70 30c35 30 35 60 0 90 35 30 35 60 0 90 35 30 35 60 0 90" stroke="url(#accent)" stroke-width="18" stroke-linecap="round" fill="none"/>
    <circle cx="70" cy="45" r="16" fill="#0F172A" opacity="0.08"/>
    <circle cx="70" cy="95" r="16" fill="#0F172A" opacity="0.08"/>
    <circle cx="70" cy="145" r="16" fill="#0F172A" opacity="0.08"/>
    <circle cx="70" cy="195" r="16" fill="#0F172A" opacity="0.08"/>
    <circle cx="70" cy="245" r="16" fill="#0F172A" opacity="0.08"/>
    <circle cx="70" cy="295" r="16" fill="#0F172A" opacity="0.08"/>
    <circle cx="70" cy="345" r="16" fill="#0F172A" opacity="0.08"/>
  </g>

  <!-- Mini UI lines -->
  <rect x="140" y="265" width="520" height="16" rx="8" fill="#E2E8F0"/>
  <rect x="140" y="295" width="500" height="16" rx="8" fill="#E2E8F0"/>
  <rect x="140" y="325" width="460" height="16" rx="8" fill="#E2E8F0"/>

  <rect x="140" y="380" width="220" height="44" rx="14" fill="#0F172A"/>
  <text x="160" y="409" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial" font-size="16" font-weight="700" fill="#FFFFFF">Book / Call</text>
</svg>
