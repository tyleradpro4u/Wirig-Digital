<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ECFEFF"/>
      <stop offset="0.55" stop-color="#EFF6FF"/>
      <stop offset="1" stop-color="#F0FDF4"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06B6D4"/>
      <stop offset="0.55" stop-color="#3B82F6"/>
      <stop offset="1" stop-color="#22C55E"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#0F172A" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="1200" height="600" rx="48" fill="url(#bg)"/>

  <g filter="url(#shadow)">
    <rect x="80" y="80" width="1040" height="440" rx="40" fill="#FFFFFF"/>
  </g>

  <text x="140" y="175" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial" font-size="34" font-weight="700" fill="#0F172A">Dental</text>
  <text x="140" y="215" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial" font-size="20" font-weight="600" fill="#475569">Demo layout</text>

  <!-- Tooth icon (full tooth + sparkle) -->
  <g transform="translate(810 140)">
    <!-- tooth -->
    <path d="M120 46c54 0 98 34 98 92 0 33-11 52-24 68-11 14-18 45-22 78-6 40-20 74-52 74-28 0-32-27-37-49-4-18-9-30-19-30s-15 12-19 30c-5 22-9 49-37 49-32 0-46-34-52-74-4-33-11-64-22-78-13-16-24-35-24-68 0-58 44-92 98-92 23 0 40 7 53 18 13-11 30-18 53-18z" fill="url(#accent)" opacity="0.92"/>
    <!-- inner highlight -->
    <path d="M120 70c-19 0-36 6-49 17-13-11-30-17-49-17-42 0-73 23-73 67 0 23 8 38 17 51 15 19 22 55 27 91 5 30 11 56 26 56 11 0 13-11 17-30 6-28 15-48 37-48s31 20 37 48c4 19 6 30 17 30 15 0 21-26 26-56 5-36 12-72 27-91 9-13 17-28 17-51 0-44-31-67-73-67z" fill="#FFFFFF" opacity="0.22"/>

    <!-- sparkle (bigger + clearer) -->
    <g transform="translate(182 26)">
      <path d="M0 26c14-3 23-12 26-26 3 14 12 23 26 26-14 3-23 12-26 26-3-14-12-23-26-26z" fill="#FFFFFF" opacity="0.98"/>
      <path d="M58 58c9-2 14-7 16-16 2 9 7 14 16 16-9 2-14 7-16 16-2-9-7-14-16-16z" fill="#FFFFFF" opacity="0.9"/>
      <path d="M20 66h20" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" opacity="0.7"/>
      <path d="M76 22v20" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" opacity="0.7"/>
    </g>
  </g>

  <!-- Mini UI lines -->
  <rect x="140" y="265" width="520" height="16" rx="8" fill="#E2E8F0"/>
  <rect x="140" y="295" width="480" height="16" rx="8" fill="#E2E8F0"/>
  <rect x="140" y="325" width="420" height="16" rx="8" fill="#E2E8F0"/>

  <rect x="140" y="380" width="200" height="44" rx="14" fill="#0F172A"/>
  <rect x="350" y="380" width="200" height="44" rx="14" fill="#FFFFFF" stroke="#CBD5E1"/>

  <text x="160" y="409" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial" font-size="16" font-weight="700" fill="#FFFFFF">New patients</text>
</svg>
