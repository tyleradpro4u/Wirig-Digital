<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E0F2FE"/>
      <stop offset="0.55" stop-color="#EDE9FE"/>
      <stop offset="1" stop-color="#DCFCE7"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0EA5E9"/>
      <stop offset="0.55" stop-color="#6366F1"/>
      <stop offset="1" stop-color="#22C55E"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#0F172A" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="1200" height="600" rx="48" fill="url(#bg)"/>

  <g filter="url(#shadow)">
    <rect x="80" y="80" width="1040" height="440" rx="40" fill="#FFFFFF"/>
  </g>

  <text x="140" y="175" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial" font-size="34" font-weight="700" fill="#0F172A">Plumber</text>
  <text x="140" y="215" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial" font-size="20" font-weight="600" fill="#475569">Demo layout</text>

  <!-- Icon: sink + dripping faucet (recreated) -->
  <g transform="translate(748 130)">
    <!-- backsplash card -->
    <rect x="30" y="40" width="330" height="290" rx="36" fill="#0F172A" opacity="0.05"/>

    <!-- countertop -->
    <rect x="60" y="170" width="270" height="34" rx="14" fill="#0F172A" opacity="0.10"/>

    <!-- faucet neck -->
    <path d="M190 90c0-22 18-40 40-40h22" stroke="#0F172A" stroke-opacity="0.10" stroke-width="22" stroke-linecap="round" fill="none"/>

    <!-- faucet spout (accent) -->
    <path d="M252 52h58c26 0 46 20 46 46v60h-66v-34c0-16-13-28-28-28h-38" stroke="url(#accent)" stroke-width="18" stroke-linecap="round" fill="none"/>

    <!-- faucet base -->
    <rect x="160" y="120" width="84" height="60" rx="18" fill="#0F172A" opacity="0.10"/>
    <!-- handle -->
    <rect x="176" y="92" width="52" height="30" rx="12" fill="#0F172A" opacity="0.10"/>

    <!-- sink bowl -->
    <path d="M86 204h218c0 66-54 120-109 120S86 270 86 204z" fill="#0F172A" opacity="0.10"/>
    <path d="M120 232h150" stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="10" stroke-linecap="round"/>

    <!-- drip -->
    <path d="M324 206c0 14-11 25-25 25s-25-11-25-25c0-20 25-44 25-44s25 24 25 44z" fill="url(#accent)" opacity="0.95"/>
    <circle cx="299" cy="252" r="7" fill="url(#accent)" opacity="0.85"/>
  </g>

  <!-- Mini UI lines -->
  <rect x="140" y="265" width="520" height="16" rx="8" fill="#E2E8F0"/>
  <rect x="140" y="295" width="440" height="16" rx="8" fill="#E2E8F0"/>
  <rect x="140" y="325" width="480" height="16" rx="8" fill="#E2E8F0"/>

  <rect x="140" y="380" width="170" height="44" rx="14" fill="#0F172A"/>
  <rect x="320" y="380" width="170" height="44" rx="14" fill="#FFFFFF" stroke="#CBD5E1"/>
  <rect x="500" y="380" width="170" height="44" rx="14" fill="#FFFFFF" stroke="#CBD5E1"/>

  <text x="160" y="409" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial" font-size="16" font-weight="700" fill="#FFFFFF">Call / Text</text>
</svg>
